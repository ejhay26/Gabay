[package]
name = "gabay-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gabay-engine = { path = "../gabay-engine" }
gabay-shell = { path = "../gabay-shell" }
gabay-map = { path = "../gabay-map" }
gabay-glass = { path = "../gabay-glass" }
gabay-platform = { path = "../gabay-platform" }
dioxus-native = "=0.7.10"
dioxus = { version = "=0.7.10", default-features = false, features = ["macro", "hooks", "html", "signals", "document"] }
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false }
gabay-design = { path = "../gabay-design" }
