[package]
name = "gabay-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "gabay"
path = "src/main.rs"

[dependencies]
gabay-ui = { path = "../gabay-ui" }
gabay-engine = { path = "../gabay-engine" }
gabay-map = { path = "../gabay-map" }
gabay-search = { path = "../gabay-search" }
gabay-routing = { path = "../gabay-routing" }
gabay-tracker = { path = "../gabay-tracker" }
gabay-assistant = { path = "../gabay-assistant" }
gabay-platform = { path = "../gabay-platform" }
dioxus-native = "=0.7.10"
dioxus = { version = "=0.7.10", default-features = false, features = ["macro", "hooks", "html", "signals", "document"] }
log.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.14"
blitz-shell = "0.2"
