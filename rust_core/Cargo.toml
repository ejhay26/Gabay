[package]
name = "rust_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "gabay_core"

[dependencies]
uniffi = { version = "0.28", features = ["cli", "tokio"] }
rstar = "0.12"
geo = "0.28"
rusqlite = { version = "0.31", features = ["bundled", "bundled-full"] }
memmap2 = "0.9"
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
log = "0.4"
anyhow = "1.0"

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }
