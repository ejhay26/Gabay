[workspace]
members = [
    "crates/gabay-design",
    "crates/gabay-platform",
    "crates/gabay-vault",
    "crates/gabay-map",
    "crates/gabay-glass",
    "crates/gabay-engine",
    "crates/gabay-search",
    "crates/gabay-routing",
    "crates/gabay-tracker",
    "crates/gabay-assistant",
    "crates/gabay-shell",
    "crates/gabay-ui",
    "crates/gabay-app",
    "tools/map_builder",
]
exclude = [
    "rust_core",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
thiserror = "2"
log = "0.4"
flate2 = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = "symbols"

[profile.dev]
opt-level = 1
debug = 1

[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
blitz-net = { path = "crates/blitz-net" }
wgpu_context = { path = "crates/wgpu_context" }
wgpu = { path = "crates/wgpu" }
vello = { path = "crates/vello" }
